name: Force publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postliste-scraping
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installer nødvendige Python-avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Generer postliste.html fra template og data
        run: |
          echo "=== GENERERER FRONTEND ==="
          python src/utils/generate_html.py

      - name: Sett opp git remote
        run: |
          git remote remove origin || true
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git remote -v

      # ---------------------------------------------------------
      # LØSNING C: LOGG INNHOLD I DATA-MAPPEN FØR COMMIT
      # ---------------------------------------------------------
      - name: Logg innhold i data/-mappen
        run: |
          echo "=== INNHOLD I data/ FØR COMMIT ==="
          ls -R data/ || true

      # ---------------------------------------------------------
      # LØSNING B: SANITY-CHECK – STOPP HVIS DATA MANGLER
      # ---------------------------------------------------------
      - name: Sjekk at nødvendige datafiler finnes
        run: |
          echo "=== SANITY CHECK ==="
          if [ ! -f data/postliste_index.json ]; then
            echo "FEIL: postliste_index.json mangler. Avbryter publish."
            exit 1
          fi
          if [ ! -f data/changes.json ]; then
            echo "FEIL: changes.json mangler. Avbryter publish."
            exit 1
          fi
          echo "Sanity check OK – nødvendige datafiler finnes."

      - name: Commit og push oppdateringer (konkurransesikker)
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          echo "=== Endringer i web/ og data/ ==="
          git status web/
          git status data/

          # Legg til endringer i frontend
          git add web/postliste.html web/script.js web/style.css web/postliste_template.html || true

          # Legg til endringer i shards
          git add data/postliste_*.json || true
          git add data/postliste_index.json || true
          git add data/changes.json || true

          # Slett legacy hvis den finnes
          git rm data/postliste.json || true

          git commit -m "Force publish med oppdatert frontend (sharded)" || echo "Ingen endringer å committe"

          # ---------------------------------------------------------
          # LØSNING A: ERSTATT STASH/REBASE MED REN PULL
          # ---------------------------------------------------------
          echo "=== HENTER SISTE ENDINGER FRA main ==="
          git pull origin main || true

          # ---------------------------------------------------------
          # PUSH MED RETRY
          # ---------------------------------------------------------
          for i in {1..5}; do
            git push origin main && break
            echo "Push feilet, prøver igjen ($i/5)..."
            git pull origin main || true
          done
