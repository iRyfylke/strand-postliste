name: Migrer legacy postliste og changes til shards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4

      # ---------------------------------------------------------
      # 1. TEST IMPORT AV utils_files
      # ---------------------------------------------------------
      - name: Test utils_files import
        run: |
          echo "=== TESTER IMPORT AV UTILS_FILES ==="
          python -u tools/test_import_utils.py

      # ---------------------------------------------------------
      # 2. KJØR MIGRERING
      # ---------------------------------------------------------
      - name: Kjør migreringsscript
        id: migrate
        run: |
          echo "=== KJØRER MIGRERING ==="
          python -u tools/migrate_legacy_to_shards.py

      # ---------------------------------------------------------
      # 3. SANITY CHECK – SIKRE AT INDEX OG SHARDS BLE LAGET
      # ---------------------------------------------------------
      - name: Sanity check etter migrering
        if: steps.migrate.outcome == 'success'
        run: |
          echo "=== SANITY CHECK ==="

          if [ ! -f data/postliste_index.json ]; then
            echo "FEIL: postliste_index.json mangler etter migrering!"
            exit 1
          fi

          if [ ! -d data/shards ]; then
            echo "FEIL: data/shards mangler etter migrering!"
            exit 1
          fi

          echo "Sanity check OK."

      # ---------------------------------------------------------
      # 4. LOGG INNHOLD I DATA-MAPPEN
      # ---------------------------------------------------------
      - name: Logg innhold i data/
        if: steps.migrate.outcome == 'success'
        run: |
          echo "=== INNHOLD I data/ ==="
          ls -R data/

      # ---------------------------------------------------------
      # 5. EKSTRA STATUS: TELL ANTALL SHARDS
      # ---------------------------------------------------------
      - name: Verifiser antall shards
        if: steps.migrate.outcome == 'success'
        run: |
          echo "=== VERIFISERER SHARDS ==="

          SHARD_COUNT=$(ls data/shards/postliste_*.json 2>/dev/null | wc -l || echo 0)
          echo "Antall shards: $SHARD_COUNT"

          if [ "$SHARD_COUNT" -lt 15 ]; then
            echo "ADVARSEL: Antall shards er lavere enn forventet (mindre enn 15)."
          else
            echo "Sharding ser fornuftig ut."
          fi

          echo "Liste over shards med filstørrelse:"
          ls -lh data/shards/postliste_*.json || true

      # ---------------------------------------------------------
      # 6. SLETT LEGACY-FILER
      # ---------------------------------------------------------
      - name: Slett legacy-filer (kun hvis migrering OK)
        if: steps.migrate.outcome == 'success'
        run: |
          echo "=== SLETTER LEGACY-FILER ==="
          rm -f data/postliste_1.json || true
          rm -f data/changes.json || true

      # ---------------------------------------------------------
      # 7. COMMIT OG PUSH
      # ---------------------------------------------------------
      - name: Commit og push migrering
        if: steps.migrate.outcome == 'success'
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          echo "=== GIT STATUS ==="
          git status data/

          # Postliste-shards
          git add data/shards/postliste_*.json || true

          # Changes-shards (riktig path)
          git add data/changes/changes_*.json || true
          git add data/changes/changes_index.json || true

          # Index
          git add data/postliste_index.json || true

          # Fjern legacy
          git rm data/postliste_1.json || true
          git rm data/changes.json || true

          git commit -m "Migrert legacy postliste_1.json og changes.json til shards" || echo "Ingen endringer å committe"
          git push origin main || true
