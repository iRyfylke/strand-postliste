name: Migrer legacy postliste og changes til shards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4

      # ---------------------------------------------------------
      # 1. TEST IMPORT AV utils_files (nå via egen .py-fil)
      # ---------------------------------------------------------
      - name: Test utils_files import
        run: |
          echo "=== TESTER IMPORT AV UTILS_FILES ==="
          python -u tools/test_import_utils.py

      # ---------------------------------------------------------
      # 2. KJØR MIGRERING MED UNBUFFERED OUTPUT
      # ---------------------------------------------------------
      - name: Kjør migreringsscript
        id: migrate
        run: |
          echo "=== KJØRER MIGRERING ==="
          python -u tools/migrate_legacy_to_shards.py

      # ---------------------------------------------------------
      # 3. SLETT LEGACY-FILER KUN HVIS MIGRERING VAR OK
      # ---------------------------------------------------------
      - name: Slett legacy-filer (kun hvis migrering OK)
        if: steps.migrate.outcome == 'success'
        run: |
          echo "=== SLETTER LEGACY-FILER ==="
          rm -f data/postliste_1.json || true
          rm -f data/changes.json || true

      # ---------------------------------------------------------
      # 4. COMMIT OG PUSH KUN HVIS MIGRERING VAR OK
      # ---------------------------------------------------------
      - name: Commit og push migrering
        if: steps.migrate.outcome == 'success'
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          echo "=== GIT STATUS ==="
          git status data/

          git add data/shards/postliste_*.json || true
          git add data/shards/postliste_index.json || true

          git add data/changes/changes_*.json || true
          git add data/changes/changes_index.json || true

          git rm data/postliste_1.json || true
          git rm data/changes.json || true

          git commit -m "Migrert legacy postliste_1.json og changes.json til shards" || echo "Ingen endringer å committe"
          git push origin main || true
