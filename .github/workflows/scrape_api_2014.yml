name: scrape-api-2014

on:
  workflow_dispatch:

jobs:
  scrape-api-2014:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run API scraper for 2014
        run: |
          python src/scrapers/scraper_api.py 2014

      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/postliste_api_2014.jsonl || true
          git commit -m "Add API-scraped postliste for 2014" || echo "Nothing to commit"
          git push || echo "Nothing to push"
