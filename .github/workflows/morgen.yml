name: Morgen-scraping

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postliste-scraping
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Playwright cache
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Installer Playwright + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium

      # -------------------------------------------------------
      # Skriv config for incremental-modus
      # -------------------------------------------------------
      - name: Skriv config.json for incremental-modus
        run: |
          mkdir -p src/config
          {
            echo "{"
            echo "  \"mode\": \"incremental\","
            echo "  \"per_page\": 100"
            echo "}"
          } > src/config/config.json

          echo "=== INNHOLD I config.json ==="
          cat src/config/config.json

      # -------------------------------------------------------
      # Kjør scraper (incremental → skriver til data/shards og data/changes)
      # -------------------------------------------------------
      - name: Kjør scraper (incremental)
        working-directory: src/scrapers
        run: |
          echo "=== STARTER INCREMENTAL-SCRAPER ==="
          python scraper.py

      # -------------------------------------------------------
      # Git remote
      # -------------------------------------------------------
      - name: Sett opp git remote
        run: |
          git remote remove origin || true
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git remote -v

      # -------------------------------------------------------
      # Commit & push (kun shards + changes)
      # -------------------------------------------------------
      - name: Commit og push oppdateringer
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          echo "=== Endringer i data/ ==="
          git status data/

          # Shards (postliste)
          git add data/shards/postliste_*.json || true
          git add data/postliste_index.json || true

          # Changes (sharded)
          git add data/changes/changes_*.json || true
          git add data/changes/changes_index.json || true

          # Legacy filer skal ALDRI eksistere
          git rm data/postliste_*.json || true
          git rm data/changes.json || true

          git commit -m "Automatisk morgenoppdatering (incremental → shards + changes)" || echo "Ingen endringer å committe"

          # -------------------------------------------------------
          # REN PULL (ingen stash/rebase)
          # -------------------------------------------------------
          git pull origin main || true

          # Push med retry
          for i in {1..5}; do
            git push origin main && break
            echo "Push feilet, prøver igjen ($i/5)..."
            git pull origin main || true
          done
