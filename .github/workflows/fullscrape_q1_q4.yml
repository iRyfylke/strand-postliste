name: Full historical scrape (Q1–Q4)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Årstall for fullscrape (f.eks. 2013)"
        required: true
        type: string

      start_page:
        description: "Start page (eldste side for året)"
        required: true
        type: string

      max_pages:
        description: "Max page (nyeste side for året)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fullscrape-q1-q4
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------
  # SETUP (felles for alle kvartaler)
  # ---------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      year: ${{ github.event.inputs.year }}
      start_page: ${{ github.event.inputs.start_page }}
      max_pages: ${{ github.event.inputs.max_pages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &setup_python
        name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright cache
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - &install_playwright
        name: Installer Playwright + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 jq
          playwright install chromium


  # ---------------------------------------------------------
  # KVARTALSMAL (Q1–Q4)
  # ---------------------------------------------------------

  scrape_Q1:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - *setup_python
      - *install_playwright

      - &write_config
        name: Skriv config_fullscrape.json
        run: |
          mkdir -p src/config
          printf '{\n  "start_page": %s,\n  "max_pages": %s,\n  "per_page": 100\n}\n' \
            "${{ needs.setup.outputs.start_page }}" \
            "${{ needs.setup.outputs.max_pages }}" \
            > src/config/config_fullscrape.json

      - name: Kjør Q1-scrape
        working-directory: src/scrapers
        run: |
          python scraper_dates.py \
            --mode full \
            --config ../config/config_fullscrape.json \
            "01.01.${{ needs.setup.outputs.year }}" \
            "31.03.${{ needs.setup.outputs.year }}"

      - name: Last opp artifact Q1
        uses: actions/upload-artifact@v4
        with:
          name: fullscrape-Q1
          path: data/postliste_filtered.json

      - name: Last opp failed_pages Q1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages-${{ needs.setup.outputs.year }}-Q1
          path: data/archive_new/failed_pages_${{ needs.setup.outputs.year }}.json
          if-no-files-found: ignore


  scrape_Q2:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4
      - *setup_python
      - *install_playwright
      - *write_config

      - name: Kjør Q2-scrape
        working-directory: src/scrapers
        run: |
          python scraper_dates.py \
            --mode full \
            --config ../config/config_fullscrape.json \
            "01.04.${{ needs.setup.outputs.year }}" \
            "30.06.${{ needs.setup.outputs.year }}"

      - name: Last opp artifact Q2
        uses: actions/upload-artifact@v4
        with:
          name: fullscrape-Q2
          path: data/postliste_filtered.json

      - name: Last opp failed_pages Q2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages-${{ needs.setup.outputs.year }}-Q2
          path: data/archive_new/failed_pages_${{ needs.setup.outputs.year }}.json
          if-no-files-found: ignore


  scrape_Q3:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4
      - *setup_python
      - *install_playwright
      - *write_config

      - name: Kjør Q3-scrape
        working-directory: src/scrapers
        run: |
          python scraper_dates.py \
            --mode full \
            --config ../config/config_fullscrape.json \
            "01.07.${{ needs.setup.outputs.year }}" \
            "30.09.${{ needs.setup.outputs.year }}"

      - name: Last opp artifact Q3
        uses: actions/upload-artifact@v4
        with:
          name: fullscrape-Q3
          path: data/postliste_filtered.json

      - name: Last opp failed_pages Q3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages-${{ needs.setup.outputs.year }}-Q3
          path: data/archive_new/failed_pages_${{ needs.setup.outputs.year }}.json
          if-no-files-found: ignore


  scrape_Q4:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4
      - *setup_python
      - *install_playwright
      - *write_config

      - name: Kjør Q4-scrape
        working-directory: src/scrapers
        run: |
          python scraper_dates.py \
            --mode full \
            --config ../config/config_fullscrape.json \
            "01.10.${{ needs.setup.outputs.year }}" \
            "31.12.${{ needs.setup.outputs.year }}"

      - name: Last opp artifact Q4
        uses: actions/upload-artifact@v4
        with:
          name: fullscrape-Q4
          path: data/postliste_filtered.json

      - name: Last opp failed_pages Q4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pages-${{ needs.setup.outputs.year }}-Q4
          path: data/archive_new/failed_pages_${{ needs.setup.outputs.year }}.json
          if-no-files-found: ignore


  # ---------------------------------------------------------
  # MERGE & COMMIT (kun archive/)
  # ---------------------------------------------------------
  merge_and_commit:
    runs-on: ubuntu-latest
    needs: [scrape_Q1, scrape_Q2, scrape_Q3, scrape_Q4]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Last ned kvartals-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Last ned failed_pages-artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: failed-pages-${{ github.event.inputs.year }}-*
          path: failed_pages_artifacts
          merge-multiple: false

      - name: Slå sammen failed_pages til én fil
        run: |
          YEAR="${{ github.event.inputs.year }}"
          mkdir -p data/archive_new

          FILES=$(find failed_pages_artifacts -name "failed_pages_${YEAR}.json" -type f || true)

          if [ -z "$FILES" ]; then
            echo "Ingen failed_pages-filer funnet for ${YEAR}. Hopper over merge."
          else
            jq -s 'add | unique | sort' $FILES > data/archive_new/failed_pages_${YEAR}.json
          fi

      - name: Arkiver kvartalsfiler
        run: |
          YEAR="${{ github.event.inputs.year }}"
          mkdir -p data/archive_new

          cp artifacts/fullscrape-Q1/postliste_filtered.json data/archive_new/postliste_${YEAR}_Q1.json
          cp artifacts/fullscrape-Q2/postliste_filtered.json data/archive_new/postliste_${YEAR}_Q2.json
          cp artifacts/fullscrape-Q3/postliste_filtered.json data/archive_new/postliste_${YEAR}_Q3.json
          cp artifacts/fullscrape-Q4/postliste_filtered.json data/archive_new/postliste_${YEAR}_Q4.json

      - name: Commit og push kvartalsfiler + failed_pages
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          YEAR="${{ github.event.inputs.year }}"

          git add data/archive_new/postliste_${YEAR}_Q*.json

          if [ -f "data/archive_new/failed_pages_${YEAR}.json" ]; then
            git add data/archive_new/failed_pages_${YEAR}.json
          fi

          git commit -m "Fullscrape ${YEAR} (Q1–Q4) + failed_pages" || echo "Ingen endringer"

          git pull --rebase origin main || true
          git push origin main || true


  # ---------------------------------------------------------
  # LAG FULL ÅRSFIL
  # ---------------------------------------------------------
  merge_full_year:
    runs-on: ubuntu-latest
    needs: merge_and_commit

    steps:
      - uses: actions/checkout@v4

      - name: Last ned kvartalsfiler
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Slå sammen kvartaler til én fil
        run: |
          YEAR="${{ github.event.inputs.year }}"
          mkdir -p data/archive_new

          jq -s 'add' \
            artifacts/fullscrape-Q1/postliste_filtered.json \
            artifacts/fullscrape-Q2/postliste_filtered.json \
            artifacts/fullscrape-Q3/postliste_filtered.json \
            artifacts/fullscrape-Q4/postliste_filtered.json \
            > data/archive_new/postliste_${YEAR}_full_unsorted.json

          jq 'sort_by(.dato)' \
            data/archive_new/postliste_${YEAR}_full_unsorted.json \
            > data/archive_new/postliste_${YEAR}_full.json

          rm data/archive_new/postliste_${YEAR}_full_unsorted.json

      - name: Commit og push full-årsfil
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git add data/archive_new/postliste_${{ github.event.inputs.year }}_full.json
          git commit -m "Fullscrape ${{ github.event.inputs.year }} – samlet årsfil" || echo "Ingen endringer"

          git pull --rebase origin main || true
          git push origin main || true
