name: Map all postliste pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Run page mapping
        working-directory: src/scrapers
        run: |
          python map_pages.py

      - name: Commit page_year_map.json
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git add data/page_year_map.json
          git commit -m "Oppdatert page_year_map.json" || echo "Ingen endringer"

          git pull --rebase origin main || true
          git push origin main || true
