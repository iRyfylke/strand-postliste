name: Gjenopprett legacy-filer fra commit

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit-hash å hente filene fra"
        required: true
        type: string

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut repo (HEAD)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Hent commit manuelt
        run: |
          mkdir old
          cd old
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch origin ${{ github.event.inputs.commit_hash }}
          git checkout ${{ github.event.inputs.commit_hash }}

      - name: Gjenopprett legacy-filer
        run: |
          echo "=== Kopierer legacy-filer fra commit ==="

          mkdir -p data

          if [ -f old/data/postliste_1.json ]; then
            cp old/data/postliste_1.json data/
            echo "Gjenopprettet postliste_1.json"
          else
            echo "Fant ikke postliste_1.json i commit"
          fi

          if [ -f old/data/changes.json ]; then
            cp old/data/changes.json data/
            echo "Gjenopprettet changes.json"
          else
            echo "Fant ikke changes.json i commit"
          fi

      - name: Commit og push gjenopprettede filer
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          git add data/postliste_1.json || true
          git add data/changes.json || true

          git commit -m "Gjenopprettet legacy-filer fra commit ${{ github.event.inputs.commit_hash }}" || echo "Ingen endringer å committe"
          git push origin main || true
