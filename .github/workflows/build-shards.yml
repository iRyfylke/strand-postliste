name: Build shards

on:
  workflow_dispatch:
  push:
    paths:
      - "data/archive/**"
      - "scripts/build_chunks_from_archive.py"
      - ".github/workflows/build-shards.yml"

jobs:
  build-shards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Clean old shards directory
        run: |
          if [ -d data/shards ]; then
            echo "[INFO] Fjerner gamle shards..."
            rm -rf data/shards
          fi
          mkdir -p data/shards

      - name: Run build-shards script
        run: |
          echo "[INFO] Starter build_chunks_from_archive.py"
          python scripts/build_chunks_from_archive.py

      - name: Show shard directory summary
        run: |
          echo "[INFO] Innhold i data/shards:"
          ls -lh data/shards

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/shards data/postliste_index.json

          if git diff --cached --quiet; then
            echo "[INFO] Ingen endringer å committe"
          else
            echo "[INFO] Committer endringer..."
            git commit -m "Oppdatert shards og index"
            git push
          fi
