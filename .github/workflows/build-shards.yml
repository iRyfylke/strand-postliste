name: Build shards

on:
  workflow_dispatch:
  push:
    paths:
      - "data/archive/**"
      - "tools/build_chunks_from_archive.py"
      - ".github/workflows/build-shards.yml"

jobs:
  build-shards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # viktig for rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Clean old shards directory
        run: |
          echo "[INFO] Rydder gamle shards..."
          rm -rf data/shards
          mkdir -p data/shards

      - name: Run build-shards script
        run: |
          echo "[INFO] Starter build_chunks_from_archive.py"
          python tools/build_chunks_from_archive.py

      - name: Show shard directory summary
        run: |
          echo "[INFO] Innhold i data/shards:"
          ls -lh data/shards

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/shards data/postliste_index.json

          if git diff --cached --quiet; then
            echo "[INFO] Ingen endringer å committe"
            exit 0
          fi

          echo "[INFO] Committer endringer..."
          git commit -m "Oppdatert shards og index"

          echo "[INFO] Henter siste endringer fra remote (rebase)..."
          git pull --rebase --autostash

          echo "[INFO] Pusher endringer..."
          git push
